name: APK Security & Purchase Analysis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK Analyzer JAR
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Dynamic APK Detection & Analysis
      run: |
        # البحث عن أي ملف APK داخل المشروع تلقائياً
        TARGET_APK=$(find . -maxdepth 3 -type f -name "*.apk" | head -n 1)
        
        if [ -n "$TARGET_APK" ]; then
          echo "[+] Found Target APK: $TARGET_APK"
          java -jar APKAnalyzer.jar "$TARGET_APK"
        else
          echo "[-] No APK file found in the repository!"
          exit 1
        fi
